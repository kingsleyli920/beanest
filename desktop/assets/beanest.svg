    <ellipse cx="301" cy="521" rx="14" ry="19" fill="#43563b"/>
    <ellipse cx="405" cy="521" rx="14" ry="19" fill="#43563b"/>
    <path d="M329 577q28 27 56-2" fill="none" stroke="#43563b" stroke-width="13" stroke-linecap="round"/>
  </g>
