<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>豆窝 · Beanest</title>
  <desc>两颗相互依靠的小豆子，代表一起协作的伙伴。</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#fbfcf3"/><stop offset="1" stop-color="#e5edd7"/>
    </linearGradient>
    <linearGradient id="green" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#bbd49a"/><stop offset="1" stop-color="#8eaf72"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2c0a8"/><stop offset="1" stop-color="#dc9c84"/>
    </linearGradient>
  </defs>
  <rect x="64" y="72" width="896" height="896" rx="204" fill="#31432c" opacity=".12"/>
  <rect x="64" y="56" width="896" height="896" rx="204" fill="url(#tile)"/>
  <rect x="67" y="59" width="890" height="890" rx="201" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="6"/>
  <ellipse cx="516" cy="772" rx="278" ry="43" fill="#647b4d" opacity=".12"/>
