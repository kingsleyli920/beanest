    <path d="M585 308c-39-11-61-38-56-72 40-4 74 21 56 72Z" fill="#78965d"/>
    <ellipse cx="550" cy="520" rx="17" ry="22" fill="#3c5135"/>
    <ellipse cx="681" cy="520" rx="17" ry="22" fill="#3c5135"/>
    <path d="M579 591q39 37 78-3" fill="none" stroke="#3c5135" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="518" cy="569" rx="23" ry="12" fill="#e8e9b7" opacity=".5"/>
    <ellipse cx="714" cy="569" rx="23" ry="12" fill="#e8e9b7" opacity=".5"/>
